name: Deploy to Pages Branch

# ⚠ 本项目已改用 Cloudflare Pages 部署（见 docs/CLOUDFLARE.md），此工作流默认不再随 push 自动运行，
#   仅保留作为 GitHub Pages 的备用方案。如需使用，在仓库 Settings → Pages 中
#   将 Source 设为 “Deploy from a branch: pages / (root)” 后手动触发。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        run: pnpm run build
      
      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: dist
          clean: true
